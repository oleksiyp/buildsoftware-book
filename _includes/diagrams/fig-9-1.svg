<div class="dg-figure" data-fig="fig-9-1" style="--dg-w:864px"><div class="dg-scroll"><svg class="dg" viewBox="0 0 864 572" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="fig-9-1-title fig-9-1-desc">
<title id="fig-9-1-title">The Eagle at Data General</title>
<desc id="fig-9-1-desc">Schematic; only the dates named are documented. Top: a timeline from 1977 to 1981 in three lanes. In 1977 the rival Digital Equipment Corporation released the 32-bit VAX. Data General moved its lead development group to North Carolina to build an ambitious new 32-bit design, the Fountainhead Project, which fell behind and was cancelled. In 1978 Tom West, in Westborough, Massachusetts, proposed Eagle, a 32-bit extension of the Eclipse, as insurance, and promised it in a year; it was built in a basement and announced in April 1980 as the Eclipse MV/8000, later than promised. Then the team was broken up and West was sent to Japan before a single MV/8000 was sold, and by July 1981, when Tracy Kidder&#x27;s book appeared, many of the engineers had left or were leaving. Bottom: the team. Tom West led it with his deputy Carl Alsing; the Microkids, led by Alsing, wrote the microcode; the Hardy Boys, led by Ed Rasala, built the hardware; Steve Wallach was the architect. About two dozen engineers, most straight out of college, &#x27;signed up&#x27; to do whatever the machine required, with overtime and no extra pay; the reward, &#x27;pinball&#x27;, was the chance to build the next.</desc>

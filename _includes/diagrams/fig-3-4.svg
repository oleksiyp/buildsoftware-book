<div class="dg-figure" data-fig="fig-3-4" style="--dg-w:864px"><div class="dg-scroll"><svg class="dg" viewBox="0 0 864 384" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="fig-3-4-title fig-3-4-desc">
<title id="fig-3-4-title">Two loops</title>
<desc id="fig-3-4-desc">The outer loop starts with an acceptance test for a whole feature, written from the outside in the language of the domain, which fails because the feature does not exist yet; the Resale team&#x27;s first was that a resold ticket moves to the buyer and the old barcode dies. Inside it runs Kent Beck&#x27;s inner loop, many times per feature: write a small failing unit test, make it pass with the simplest code that works, then refactor while the tests stay green, and start again. When the acceptance test passes the feature is done and the outer loop turns once, to the next feature. Fucci and colleagues found in 2017 that small, steady cycles went with better outcomes, and that whether the test came before the code did not.</desc>

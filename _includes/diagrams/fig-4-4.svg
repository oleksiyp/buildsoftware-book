<div class="dg-figure" data-fig="fig-4-4" style="--dg-w:864px"><div class="dg-scroll"><svg class="dg" viewBox="0 0 864 496" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="fig-4-4-title fig-4-4-desc">
<title id="fig-4-4-title">encore-core&#x27;s CI before and after</title>
<desc id="fig-4-4-desc">Paired bars for each step of continuous integration on encore-core, in minutes, before and after the work of months five to eight. Check out and set up: 3 to 1, by a shallow clone with the toolchain and dependencies prebuilt into the runner image. Compile: 9 to 3, by a remote cache, since most modules are unchanged by any one change. Unit and component tests: 14 to 3, by running only the tests the module graph says a change can affect. Static analysis: 3 to 1, by analyzing changed modules only. Package the artifact: 2 to 1, by cached layers. Total, from push to verdict: 31 to 9 minutes. Test selection and the remote cache account for 17 of the 22 minutes saved. A dashed line marks about 6 minutes, the CI time of a golden-path service.</desc>

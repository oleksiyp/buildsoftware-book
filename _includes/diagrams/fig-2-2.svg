<div class="dg-figure" data-fig="fig-2-2" style="--dg-w:864px"><div class="dg-scroll"><svg class="dg" viewBox="0 0 864 352" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="fig-2-2-title fig-2-2-desc">
<title id="fig-2-2-title">The debt metaphor, 1980 to 2016</title>
<desc id="fig-2-2-desc">A timeline from 1978 to 2018 on a proportional scale. Above the line: Lakoff and Johnson&#x27;s Metaphors We Live By (1980), the book Cunningham later said shaped his interest in metaphor; Ward Cunningham&#x27;s WyCash experience report, dated 26 March 1992 and presented at OOPSLA in Vancouver in October 1992, which coins the debt metaphor and says the debt is paid back with a rewrite; Martin Fowler&#x27;s Refactoring (1999), which made refactoring a working vocabulary; and Cunningham&#x27;s 2009 video, which retells the repayment as refactoring and says the metaphor was never a license to write code poorly. Below the line: William Opdyke&#x27;s Illinois doctoral thesis (1992), which first defined refactoring in depth, in the same year as the report; Fowler&#x27;s technical debt quadrant (2009), crossing reckless with prudent and deliberate with inadvertent; and the Dagstuhl seminar of April 2016, which agreed a definition centred on constructs expedient in the short term that make future change more costly or impossible. A bracket marks the 17 years between the coinage and Cunningham&#x27;s gloss. The two Cunningham entries are highlighted.</desc>

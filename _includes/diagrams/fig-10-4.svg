<div class="dg-figure" data-fig="fig-10-4" style="--dg-w:864px"><div class="dg-scroll"><svg class="dg" viewBox="0 0 864 316" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="fig-10-4-title fig-10-4-desc">
<title id="fig-10-4-title">Encore&#x27;s capacity allocation</title>
<desc id="fig-10-4-desc">One bar of Encore&#x27;s engineering capacity in year nine, about 400 engineers, divided in four. New product and features, 56%: bets, roadmap features and new markets; set as the residual after the other lines, and the only line negotiated each quarter. Keeping the lights on, 20%: unplanned work, on-call, upgrades and support escalations; measured as each team&#x27;s trailing two-quarter share. Debt and risk, 14%: chosen by teams against their own scorecards and incidents; a floor of one-tenth per team, protected. Platform group, 10%: nine teams, 40 people; funded centrally before allocation and shown to each value stream as a platform tax.</desc>

<div class="dg-figure" data-fig="fig-2-5" style="--dg-w:864px"><div class="dg-scroll"><svg class="dg" viewBox="0 0 864 432" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="fig-2-5-title fig-2-5-desc">
<title id="fig-2-5-title">Reissue, sprouted beside the issuer</title>
<desc id="fig-2-5-desc">Inside Seat Inventory &amp; Ticketing, owned by the Inventory team, two pieces of code sit side by side. On the right is the old barcode issuer: existing callers choose one of its issue variants, and every variant finally calls one pinch point that builds and persists a ticket. A characterization suite of 1,400 cases, running in continuous integration, pins what that pinch point does today. On the left is Reissue, a new class tested from birth. The Resale service calls it with a reissue request; Reissue makes exactly one call into the old issuer, through the pinch point the tests already cover, and does everything new in its own code: it revokes the old identity, issues a new opaque ticket_id, and emits the event for the ledger. Inventory owns issuance and revocation; Resale calls it, as an architecture decision record settled.</desc>

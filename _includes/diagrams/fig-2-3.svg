<div class="dg-figure" data-fig="fig-2-3" style="--dg-w:864px"><div class="dg-scroll"><svg class="dg" viewBox="0 0 864 384" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="fig-2-3-title fig-2-3-desc">
<title id="fig-2-3-title">Hotspots on the purchase path</title>
<desc id="fig-2-3-desc">A scatter chart of Encore&#x27;s top five hotspots on the purchase path over twelve months, with size in lines across and number of changes up. 1: ticketing/barcode/BarcodeIssuer.kt, 214 changes, 3,900 lines, 88% of changes by its top author. 2: orders/saga/PurchaseSaga.kt, 187 changes, 2,600 lines, 21%. 3: ticketing/barcode/BarcodeFormats.kt, 131 changes, 1,450 lines, 91%. 4: inventory/holds/HoldService.kt, 96 changes, 1,700 lines, 34%. 5: orders/psp/PspRouter.kt, 88 changes, 1,100 lines, 29%. The two barcode files are highlighted: nearly all their changes come from one person, while the saga&#x27;s are spread across many authors.</desc>

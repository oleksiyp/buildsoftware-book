<div class="dg-figure" data-fig="fig-1-3" style="--dg-w:864px"><div class="dg-scroll"><svg class="dg" viewBox="0 0 864 412" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="fig-1-3-title fig-1-3-desc">
<title id="fig-1-3-title">What slows Encore&#x27;s engineers</title>
<desc id="fig-1-3-desc">Horizontal bars give the share of engineers naming each answer in their top three, in Encore&#x27;s latest quarterly survey, which about 68% answered. Waiting for CI on the shared repository, 54%, Chapter 4. Waiting for review, especially from other teams, 46%, Chapters 4 and 10. Flaky end-to-end tests that fail for no reason anyone can find, 39%, Chapter 3. Fear of changing old code nobody fully understands, 31%, Chapter 2, highlighted because Verified Resale must change the oldest code. Building plumbing the platform should provide, such as partner webhooks, 24%, Chapter 6. New engineers taking about a quarter to make a meaningful change, 21%, Chapter 9.</desc>

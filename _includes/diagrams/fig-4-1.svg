<div class="dg-figure" data-fig="fig-4-1" style="--dg-w:864px"><div class="dg-scroll"><svg class="dg" viewBox="0 0 864 420" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="fig-4-1-title fig-4-1-desc">
<title id="fig-4-1-title">Git in 2005</title>
<desc id="fig-4-1-desc">A timeline. Before Git, from 1991 to 2002, Linux kernel changes travelled as patches and tarballs applied by hand by Linus Torvalds; from 2002 to 2005 the kernel used BitKeeper, BitMover&#x27;s proprietary system, offered free to open-source developers. In the spring of 2005, after Andrew Tridgell wrote a client that read BitKeeper&#x27;s metadata, BitMover withdrew the free license. The 2005 axis below draws April at about eight times the scale of May to December. By the commonly cited chronology, work on Git began on 3 April. On 6 April Torvalds posted &#x27;Kernel SCM saga..&#x27; to the linux-kernel list, saying he would stop using BitKeeper. On 7 April Git committed its own source, &#x27;Initial revision of git, the information manager from hell&#x27;. On 18 April came the first merge of several branches; on 19 April Olivia Mackall announced Mercurial, for the same reason. On 16 June Git managed the 2.6.12 kernel release, about ten weeks after it first hosted itself. On 26 July Torvalds handed maintenance to Junio Hamano, and Git 1.0 appeared on 21 December 2005.</desc>

<div class="dg-figure" data-fig="fig-5-4" style="--dg-w:864px"><div class="dg-scroll"><svg class="dg" viewBox="0 0 864 424" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="fig-5-4-title fig-5-4-desc">
<title id="fig-5-4-title">The validation ladder</title>
<desc id="fig-5-4-desc">Five rungs, run in order from left to right on each of the 60 agent-generated changes, one per call site, in 11 repositories owned by seven teams. Each rung costs more than the one before. Rung 1, build and static checks, run by CI (continuous integration): the change compiles and passes lint and fitness functions; at Encore it caught 4 changes that imported the lookup client in a forbidden direction. Rung 2, characterization and unit tests, run by CI with tests the agent cannot edit: old behavior preserved where it should be; it caught 7 changes that altered behavior at an edge. Rung 3, the sponsor&#x27;s inspection by Ines: the change does what the spec says and nothing else; it caught 9 changes with unrelated improvements, reverted hunk by hunk. Rung 4, owner review, one shard per team, by the owning team: the change is right for this code and its context; one shard, Venue Entry&#x27;s, was rejected outright (Section 5.3). Rung 5, progressive delivery by canary, as for any change: behavior in production; it caught nothing.</desc>

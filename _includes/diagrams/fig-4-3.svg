<div class="dg-figure" data-fig="fig-4-3" style="--dg-w:864px"><div class="dg-scroll"><svg class="dg" viewBox="0 0 864 404" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="fig-4-3-title fig-4-3-desc">
<title id="fig-4-3-title">A request-routed preview</title>
<desc id="fig-4-3-desc">Encore&#x27;s staging cell runs a shared baseline of every service, continuously updated; the resale journey touches four of them: the Resale service, encore-core (the Orders &amp; Payments purchase saga and Inventory&#x27;s reissue), Venue Entry&#x27;s revocation feed and Notifications, which replaces the seller&#x27;s wallet pass. A preview for one change deploys only the services the change altered, here Resale, encore-core and the revocation feed, three repositories under one preview key. Ordinary requests flow through the baseline. Requests carrying the key are routed by the mesh to the preview versions wherever one exists, and to the baseline elsewhere, so the key-carrying request reaches the baseline Notifications, which the change did not touch. This works because every service propagates request context, as Encore&#x27;s services already propagate traceparent, and the mesh can route on headers. The preview versions are torn down when the change merges; a full slice is kept only for journeys whose test data cannot be isolated in the baseline.</desc>

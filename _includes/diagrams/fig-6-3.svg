<div class="dg-figure" data-fig="fig-6-3" style="--dg-w:864px"><div class="dg-scroll"><svg class="dg" viewBox="0 0 864 464" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="fig-6-3-title fig-6-3-desc">
<title id="fig-6-3-title">The Resale team&#x27;s first deploy</title>
<desc id="fig-6-3-desc">Seven steps laid end to end across 23 working days, with waiting shaded. Create the repository and service from the template: 1 day, no waiting. Walking-skeleton build with the pipeline green: 2 days, no waiting. Sandbox partner credential: 5 days, all waiting, on a ticket to Security Engineering and a certificate issued by hand. Production partner credential: 4 days, all waiting, on a second ticket with a separate approval. Write a webhook sender, copied from Partner APIs&#x27;: 3 days, no waiting. Security review of the new sender: 6 days, all waiting, in the review queue with questions about the signing scheme. First production deploy and first webhook to Rowmate&#x27;s sandbox: 2 days, no waiting. In total 23 working days, of which 15 were waiting: 9 for credentials and 6 for the review of a sender the platform did not offer.</desc>

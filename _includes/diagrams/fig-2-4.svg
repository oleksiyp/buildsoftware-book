<div class="dg-figure" data-fig="fig-2-4" style="--dg-w:864px"><div class="dg-scroll"><svg class="dg" viewBox="0 0 864 312" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="fig-2-4-title fig-2-4-desc">
<title id="fig-2-4-title">The legacy change algorithm</title>
<desc id="fig-2-4-desc">Five steps in order, left to right, as the Inventory and Resale teams applied them to the barcode issuer between months four and nine. 1, identify the change points: issuing a ticket to a new holder, revoking the old identity, and recording both in TicketIssued events. 2, find the test points: one pinch point, the method every issue variant finally calls to build and persist a ticket. 3, break dependencies: the issuer read the clock, the secret store and the event-code table directly, and each became a constructor parameter. 4, write tests: a characterization suite of 1,400 cases, most generated by replaying a year of issuance requests. 5, only then change and refactor: Reissue sprouted beside the issuer, and the issue variants collapse behind it later, as debt item INV-DEBT-017. Steps 3 and 4, highlighted, took most of the effort; the change itself was small. A note marks step 5 as where the instinct says to begin.</desc>

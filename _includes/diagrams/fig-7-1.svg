<div class="dg-figure" data-fig="fig-7-1" style="--dg-w:864px"><div class="dg-scroll"><svg class="dg" viewBox="0 0 864 556" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="fig-7-1-title fig-7-1-desc">
<title id="fig-7-1-title">Tenants that differ only in data</title>
<desc id="fig-7-1-desc">A schematic of Salesforce&#x27;s Force.com multitenant design as its 2008 whitepaper and the 2009 SIGMOD paper describe it, not a drawing of any real screen or table. At the top left, the universal data dictionary holds every tenant&#x27;s objects, fields, forms, workflows and access rules as metadata. One shared runtime engine reads that metadata and generates each tenant&#x27;s &#x27;virtual&#x27; application at runtime, so no real table is created and no code is compiled per tenant; governors cap the processor time, memory and queries any one tenant&#x27;s code may use in a single execution. Below, all tenant data sits in one shared table: an OrgID column, then hundreds of generic variable-length flex columns, Value0 to Value500, onto which each tenant&#x27;s custom fields are mapped, so Org A&#x27;s first custom field and Org B&#x27;s first custom field share the column Value0. An IsDeleted flag makes deletes soft, sending rows to a recycle bin. Indexes are kept in separate pivot tables, MT_Indexes, copied synchronously. The OrgID, highlighted, leads every index and partitions every table, and every query the engine runs is filtered by it. The organization names and field placements in the table are illustrative.</desc>

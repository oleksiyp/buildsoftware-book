<div class="dg-figure" data-fig="fig-5-1" style="--dg-w:864px"><div class="dg-scroll"><svg class="dg" viewBox="0 0 864 448" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="fig-5-1-title fig-5-1-desc">
<title id="fig-5-1-title">A-0, the compiling routine</title>
<desc id="fig-5-1-desc">Schematic, not a reproduction of any document. On the left, the mathematician&#x27;s specification: a list of entries, each naming a subroutine by its call number, with its arguments. Below the centre, a catalogued library of subroutines. In the centre, the A-0 compiling routine on the UNIVAC I fetches the named subroutines from the library and adjusts their addresses so they fit together. On the right, the result: a complete machine-code program made of those subroutines, with duplicate data transfers between them, which is then run. Below it, a person removes the duplicate transfers by hand, as Hopper proposed in 1952: the machine generates, a person refines and owns the result.</desc>

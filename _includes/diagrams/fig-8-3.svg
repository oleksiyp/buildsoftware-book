<div class="dg-figure" data-fig="fig-8-3" style="--dg-w:864px"><div class="dg-scroll"><svg class="dg" viewBox="0 0 864 548" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="fig-8-3-title fig-8-3-desc">
<title id="fig-8-3-title">The listing state machine</title>
<desc id="fig-8-3-desc">A listing&#x27;s states and transitions in Verified Resale. A seller lists on a partner or in Encore&#x27;s app, and the listing becomes listed if it passes Gate provenance, the per-fan listing limit, a price at or below the cap, resale enabled for the event, the resale window open, and step-up sign-in after a recent credential change; owner Resale. When a buyer starts checkout the listing moves from listed to reserved, guarded by Bot Screening, the per-buyer limit and the window being open; owners Resale and Bot Screening. If payment is not authorized within 5 minutes it returns from reserved to listed. When payment is authorized with strong customer authentication it moves from reserved to sold, guarded by the primary payment service provider being available; owner Orders &amp; Payments. When the sale is recorded it moves from sold to reissued: the old ticket identity is voided and a new one issued in one step; owner Inventory. From listed, a listing is withdrawn when the seller withdraws, the organizer disables resale, a rule change makes it invalid or the event is cancelled, and it expires when the window closes two hours before doors. The return, withdrawn and expired transitions have no guards and are owned by Resale. Partners are told of every transition by webhook and reconcile their copies hourly.</desc>

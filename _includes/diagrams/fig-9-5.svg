<div class="dg-figure" data-fig="fig-9-5" style="--dg-w:864px"><div class="dg-scroll"><svg class="dg" viewBox="0 0 864 460" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="fig-9-5-title fig-9-5-desc">
<title id="fig-9-5-title">The four states of a team</title>
<desc id="fig-9-5-desc">Four states drawn as a rising staircase, after Will Larson. A team falling behind has more work arriving than it can finish; the fix is to hire more people until it is treading water. A team treading water keeps up but cannot reduce its backlog; the fix is to add process to consolidate its efforts and reduce concurrent work, that is, limit work in progress. A team repaying debt can at last pay down its accumulated problems; the fix is to add time. A team innovating can take on new work; the fix is to keep enough slack in the schedule to build quality in. At Encore&#x27;s month four, Partner APIs was falling behind and shed webhook delivery; Inventory was repaying debt on the barcode core and needed protected time for characterization tests; the new Resale team was innovating by design. No team is named as treading water.</desc>

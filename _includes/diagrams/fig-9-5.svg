<rect class="dg-n dg-n-focal" x="660" y="64" width="160" height="56" rx="8"/>
<text class="dg-name" x="740" y="90">Innovating</text>
<text class="dg-sub" x="740" y="104">can take on new work</text>
<text class="dg-eyebrow" x="24" y="32" style="text-anchor:start">DIAGNOSE THE STATE, THEN APPLY ITS FIX · AFTER LARSON (2018)</text>
<line class="dg-rule" x1="24" y1="312" x2="840" y2="312"/>
<text class="dg-eyebrow" x="24" y="332" style="text-anchor:start">FIX · HIRE</text>
<text class="dg-note" x="24" y="352" text-anchor="start">“Hire more people until the</text>
<text class="dg-note" x="24" y="366" text-anchor="start">team moves into treading</text>
<text class="dg-note" x="24" y="380" text-anchor="start">water.”</text>
<text class="dg-note" x="24" y="408" text-anchor="start">Encore, month 4: Partner APIs</text>
<text class="dg-eyebrow" x="236" y="332" style="text-anchor:start">FIX · LIMIT WORK IN PROGRESS</text>
<text class="dg-note" x="236" y="352" text-anchor="start">“Add process to consolidate</text>
<text class="dg-note" x="236" y="366" text-anchor="start">the team’s efforts… and</text>
<text class="dg-note" x="236" y="380" text-anchor="start">reduce concurrent work.”</text>
<text class="dg-note" x="236" y="408" text-anchor="start">Encore, month 4: none named</text>
<text class="dg-eyebrow" x="448" y="332" style="text-anchor:start">FIX · ADD TIME</text>
<text class="dg-note" x="448" y="352" text-anchor="start">“Add time.”</text>
<text class="dg-note" x="448" y="408" text-anchor="start">Encore, month 4: Inventory</text>
<text class="dg-eyebrow" x="660" y="332" style="text-anchor:start">FIX · KEEP SLACK</text>
<text class="dg-note" x="660" y="352" text-anchor="start">“Maintain enough slack in your</text>
<text class="dg-note" x="660" y="366" text-anchor="start">team’s schedule… to build</text>
<text class="dg-note" x="660" y="380" text-anchor="start">quality into their work.”</text>
<text class="dg-note" x="660" y="408" text-anchor="start">Encore, month 4: Resale</text>

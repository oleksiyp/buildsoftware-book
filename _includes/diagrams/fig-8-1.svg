<text class="dg-note" x="432" y="352" text-anchor="middle">NBI WAS OWNED BY ITS MEMBER BANKS, WHO WENT ON COMPETING FOR CARDHOLDERS AND MERCHANTS.</text>
<text class="dg-note" x="432" y="366" text-anchor="middle">THE FEE CARRIED PART OF THE ISSUER&#x27;S COSTS: CREDIT LOSSES, THE INTEREST-FREE PERIOD,</text>
<text class="dg-note" x="432" y="380" text-anchor="middle">AND NO FEE FROM THE CARDHOLDER. A DEFAULT, SO NOBODY HAD TO NEGOTIATE.</text>

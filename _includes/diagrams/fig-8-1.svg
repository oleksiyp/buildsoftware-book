<div class="dg-figure" data-fig="fig-8-1" style="--dg-w:864px"><div class="dg-scroll"><svg class="dg" viewBox="0 0 864 576" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="fig-8-1-title fig-8-1-desc">
<title id="fig-8-1-title">The four-party system and its default fee</title>
<desc id="fig-8-1-desc">Schematic. Top: the four-party system the Eleventh Circuit described. A cardholder buys with the card from a merchant; the bank that issued the card issued it to the cardholder; the merchant passes the charge to its own bank, the merchant&#x27;s bank. Inside National BankAmericard Inc. (NBI), formed in 1970 and owned by its member banks, who went on competing for cardholders and merchants, the charge clears from the merchant&#x27;s bank through NBI to the issuing bank. From late 1971 the merchant&#x27;s bank pays the issuer a uniform fee set by the network on every transaction that clears through NBI, to carry part of the issuer&#x27;s costs: credit losses, the interest-free period and the absence of a cardholder fee. The fee is a default: two banks could bypass the network&#x27;s clearing and negotiate another rate privately. Bottom: a timeline of events in order, not to scale. 1958, BankAmericard launched in California. 1966, licensed to banks across the United States. 1968, Columbus, Ohio meeting; Hock heads a committee. 1969, Sausalito design meetings. 1970, NBI formed with Hock as president. Late 1971, the uniform interchange fee. 1973, VisaNet. 1976, renamed Visa. 1984, Hock resigns and the district court finds for Visa in NaBanco&#x27;s suit. 1986, the Eleventh Circuit affirms.</desc>

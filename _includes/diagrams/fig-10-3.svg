<div class="dg-figure" data-fig="fig-10-3" style="--dg-w:864px"><div class="dg-scroll"><svg class="dg" viewBox="0 0 864 356" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="fig-10-3-title fig-10-3-desc">
<title id="fig-10-3-title">Four forecasts of one milestone</title>
<desc id="fig-10-3-desc">Weeks from the start of June, when the forecasts were made at month 4, on a scale from 8 to 22, with the commitment, the start of October, at about week 17.4. Points converted to a date (410 points at 37 points a week): 11 weeks, with no percentile. Monte Carlo with a fixed backlog (80 items, the last 12 weeks&#x27; throughput): 10 weeks at the 50th percentile, 11 at the 85th. Monte Carlo with backlog growth (80 items grown by 30 to 65 percent): 15 weeks at the 50th, 17 at the 85th, the last week of September. The week-8 re-run, before the cut, on the remaining items after discovered work: the 85th percentile three weeks past the commitment. After the cut the 85th percentile came back to late September, and the sandbox opened to Rowmate on 29 September.</desc>

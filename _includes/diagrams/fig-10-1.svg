<div class="dg-figure" data-fig="fig-10-1" style="--dg-w:864px"><div class="dg-scroll"><svg class="dg" viewBox="0 0 864 480" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="fig-10-1-title fig-10-1-desc">
<title id="fig-10-1-title">Polaris, 1955 to 1960</title>
<desc id="fig-10-1-desc">Schematic timeline from 1955 to 1964. A dashed bar shows the original plan: from the Special Projects Office&#x27;s creation late in 1955, with Rear Admiral William F. Raborn as director, to an interim capability around 1963. A solid bar shows the programme as delivered, ending with the first deterrent patrol in November 1960; the missile that went to sea, the A-1, had less range and a smaller warhead than first wanted. Events marked on the axis: late 1955, the office is created; October 1957, Sputnik, after which the target moves to 1960; 1959, the PERT paper in Operations Research; 20 July 1960, USS George Washington makes the first launch from a submerged submarine; November 1960, the first deterrent patrol, roughly three years ahead of the original plan by the Navy&#x27;s own account. Two panels below. The technique: PERT drew the programme as a network of events joined by activities, took three-point estimates weighted four to one toward the most likely time, and let the critical path set the date; contractors resented it and the office never evaluated it. What delivered the programme: a national priority, an office protected from rival bureaus, people who believed in the work, and scope that gave way to the date.</desc>

<div class="dg-figure" data-fig="fig-5-2" style="--dg-w:864px"><div class="dg-scroll"><svg class="dg" viewBox="0 0 864 320" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="fig-5-2-title fig-5-2-desc">
<title id="fig-5-2-title">Belief against measurement</title>
<desc id="fig-5-2-desc">Two randomized trials, each plotted on one row, on a scale of how much faster developers were with AI, from 30% slower to 60% faster. Peng and colleagues, 2023, 95 freelance developers on one JavaScript task: participants guessed a gain of about 35%; the measured gain was 55.8% faster (71.17 against 160.89 minutes), so they underestimated it. METR, 2025, 16 experienced maintainers on 246 issues in their own repositories: before starting they expected a 24% speedup, afterward they believed they had been 20% faster, and the measured result was 19% slower, a gap of about 40 percentage points in the opposite direction.</desc>

<div class="dg-figure" data-fig="fig-9-7" style="--dg-w:864px"><div class="dg-scroll"><svg class="dg" viewBox="0 0 864 420" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="fig-9-7-title fig-9-7-desc">
<title id="fig-9-7-title">Onboarding cohorts in year nine</title>
<desc id="fig-9-7-desc">A line chart of Encore&#x27;s four onboarding cohorts in year nine, with median days to a new engineer&#x27;s first and tenth merged change. Months 0 to 2, 9 new engineers, the baseline: 11 days to first change, 71 to tenth. Months 3 to 5, 12 engineers, after onboarding got an owner, the buddy was assigned before day one and the first task was chosen in advance: 6 and 48. Months 6 to 8, 10 engineers, with the golden-path environment ready on day one and a curriculum: 4 and 33. Months 9 to 11, 9 engineers, after a day-30 feedback survey fed back into the curriculum: 3 and 27. A shaded band marks the first week. The first change moved inside week one; the tenth fell more slowly.</desc>

<div class="dg-figure" data-fig="fig-5-5" style="--dg-w:864px"><div class="dg-scroll"><svg class="dg" viewBox="0 0 864 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="fig-5-5-title fig-5-5-desc">
<title id="fig-5-5-title">A staggered randomized rollout</title>
<desc id="fig-5-5-desc">A timeline in months from month 0 of year 9 to month 18, with one row for each of four cohorts of ten stream-aligned teams, drawn in random order. Cohort 1, which includes Inventory, receives background agents at month 3; cohort 2, which the Resale team joined when it formed at month 4, at month 6; cohort 3 at month 9; cohort 4 at month 12. Before its start each cohort is waiting and serves as comparison for the cohorts already using agents; the quarter just before its start is its baseline. Quality lag indicators are tracked for two quarters past each start, and the decision to expand, hold or withdraw is taken at each cohort start. A vertical line at month 9 marks the first answer, when cohort 1 had two quarters of use: merged changes per engineer up about 10% with an interval that includes no change, review time per change up about a fifth, rework rate flat, no detectable difference in change failure rate, and static warnings in changed code up in six of the ten teams.</desc>

<div class="dg-figure" data-fig="fig-9-2" style="--dg-w:864px"><div class="dg-scroll"><svg class="dg" viewBox="0 0 864 404" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="fig-9-2-title fig-9-2-desc">
<title id="fig-9-2-title">People as stocks and flows</title>
<desc id="fig-9-2-desc">A stock-and-flow diagram. Hires flow into a stock of engineers who are ramping up. Ramping engineers flow into the stock of productive engineers through a valve whose rate is set by onboarding capacity, the time of experienced people; a buddy can usefully take one newcomer at a time. Productive engineers leave through two outflows, attrition and moves into management, and they also feed back into the valve, because they are the buddies for the next cohort; a cohort that ramped slowly becomes poorly prepared buddies. Each flow has a limit, and a growth target must be checked against all of them. Encore&#x27;s year six, shown as an example: 150 hired, 20 left, and 145 of 250 engineers had joined within the previous 12 months.</desc>

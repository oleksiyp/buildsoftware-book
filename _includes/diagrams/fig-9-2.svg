<text class="dg-note" x="24" y="196" text-anchor="start">Year six at Encore: 150 hired, 20 left; 145 of 250 had joined within 12 months.</text>
<text class="dg-note" x="24" y="212" text-anchor="start">Fewer engineers with a year&#x27;s tenure than newcomers, so buddies were</text>
<text class="dg-note" x="24" y="228" text-anchor="start">doubled up, borrowed from other teams or skipped.</text>
<text class="dg-note" x="24" y="340" text-anchor="start">Slow ramping one year leaves poorly trained buddies the next; the limit is a stock, not effort.</text>

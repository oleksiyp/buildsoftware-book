<div class="dg-figure" data-fig="fig-1-1" style="--dg-w:864px"><div class="dg-scroll"><svg class="dg" viewBox="0 0 864 500" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="fig-1-1-title fig-1-1-desc">
<title id="fig-1-1-title">Garmisch, 1968</title>
<desc id="fig-1-1-desc">Schematic, top: people from three constituencies, the users of computers, their manufacturers and the universities, more than 50 from 11 countries, came to the NATO conference at Garmisch, 7 to 11 October 1968, chaired by Friedrich L. Bauer. It worked in three groups, on the design, the production and the service of software. Rapporteurs&#x27; notes and tape recordings became the report, written in Munich by Peter Naur and Brian Randell and published in January 1969. Bottom, a timeline to scale: late 1967, the NATO Science Committee&#x27;s study group recommends the conference; April 1968, Conway&#x27;s &#x27;How Do Committees Invent?&#x27; appears in Datamation; 7 to 11 October 1968, Garmisch; January 1969, the report; 27 to 31 October 1969, the second conference near Rome, after which the series was not continued; 1972, Dijkstra&#x27;s Turing lecture &#x27;The Humble Programmer&#x27; calls Garmisch the turning point and makes &#x27;software crisis&#x27; canonical.</desc>

<div class="dg-figure" data-fig="fig-6-4" style="--dg-w:864px"><div class="dg-scroll"><svg class="dg" viewBox="0 0 864 324" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="fig-6-4-title fig-6-4-desc">
<title id="fig-6-4-title">Adoption funnel for webhook delivery</title>
<desc id="fig-6-4-desc">Two funnels side by side for the 14 services whose manifests declared exposure: partner by month 11, one at month 9 and one at month 11. Aware means the owning team has seen the path&#x27;s brief or newsletter entry: 14 at month 9, 14 at month 11. Tried means the service has sent a webhook through it in the sandbox: 7, then 10. Adopted means the service sends its production webhooks through it: 2, then 6. Still using after six months means adopted and has not reintroduced its own sender: no count yet at either month. The stall between tried and adopted lasted until retries became configurable per partner.</desc>

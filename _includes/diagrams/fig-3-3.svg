<div class="dg-figure" data-fig="fig-3-3" style="--dg-w:864px"><div class="dg-scroll"><svg class="dg" viewBox="0 0 864 496" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="fig-3-3-title fig-3-3-desc">
<title id="fig-3-3-title">Sorting code by what it deserves</title>
<desc id="fig-3-3-desc">A two-by-two grid after Khorikov. The horizontal axis is the number of collaborators the code talks to, few to many; the vertical axis is its complexity or domain significance, low to high. Top left, complex with few collaborators: domain model and algorithms, which deserve thorough unit tests because that is where the bugs that matter live; Encore&#x27;s fee split, made a pure function, sits here. Top right, complex and entangled with many collaborators: overcomplicated code, which deserves a refactoring before a test, because any test written now is large, slow and brittle; Encore&#x27;s barcode issuance sits here. Bottom left, simple with few collaborators: trivial code such as getters and data classes, which deserves no tests, though that never covers glue where money or seats move. Bottom right, simple with many collaborators: controllers, which deserve a few integration tests of the wiring; Encore&#x27;s resale purchase saga is mostly wiring and every link of it is integration-tested. An arrow shows Meszaros&#x27;s Humble Object refactoring moving the decisions out of overcomplicated code into a plain testable object, leaving a thin shell behind with the controllers. A heuristic, not a measured result.</desc>

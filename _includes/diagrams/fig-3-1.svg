<div class="dg-figure" data-fig="fig-3-1" style="--dg-w:864px"><div class="dg-scroll"><svg class="dg" viewBox="0 0 864 504" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="fig-3-1-title fig-3-1-desc">
<title id="fig-3-1-title">Ariane 501: the flight and the test</title>
<desc id="fig-3-1-desc">A schematic after the inquiry board&#x27;s report, in two rows. The top row is the flight of 4 June 1996. The Ariane 5 trajectory, which builds horizontal velocity much faster than Ariane 4&#x27;s, feeds two inertial reference systems running identical software on the same inputs. Converting the horizontal bias from a 64-bit float to a 16-bit signed integer raised an operand error; the backup unit failed first and the active unit, SRI 2, one data cycle (72 ms) later, at about 36.7 seconds after main-engine ignition, so there was nothing to switch to. The active unit&#x27;s diagnostic bit pattern reached the on-board computer, which read it as flight data and commanded full nozzle deflection; the launcher broke up and was destroyed near 4 km. The bottom row is the testing. The SRI specification left out the Ariane 5 trajectory by joint agreement; in 1992 the project decided to use simulated SRI outputs instead of the real units in closed-loop system simulation; so every test passed, faithful to a world that was gone. The board&#x27;s recommendations 2 and 10 ask for as much real equipment as technically feasible and for trajectory data in specifications and test requirements.</desc>

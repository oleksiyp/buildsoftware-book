<text class="dg-eyebrow" x="24" y="28" style="text-anchor:start">ARIANE 501 · SCHEMATIC, AFTER THE INQUIRY BOARD'S REPORT</text>
<text class="dg-note" x="232" y="220" text-anchor="start">same software, same inputs:</text>
<text class="dg-note" x="232" y="234" text-anchor="start">BH, 64-bit float → 16-bit int</text>
<text class="dg-note" x="468" y="220" text-anchor="start">diagnostic bit pattern</text>
<text class="dg-note" x="468" y="234" text-anchor="start">from the failed unit</text>
<text class="dg-note" x="688" y="220" text-anchor="start">destroyed near 4 km</text>
<text class="dg-note" x="688" y="234" text-anchor="start">about H0 + 39 s</text>
<text class="dg-note" x="32" y="220" text-anchor="start">never fed to the SRI</text>
<text class="dg-note" x="32" y="234" text-anchor="start">software in any test</text>
<text class="dg-note" x="32" y="384" text-anchor="start">left out by joint</text>
<text class="dg-note" x="32" y="398" text-anchor="start">agreement</text>
<text class="dg-note" x="232" y="384" text-anchor="start">SRI reused from Ariane 4,</text>
<text class="dg-note" x="232" y="398" text-anchor="start">“practically the same”</text>
<text class="dg-note" x="468" y="384" text-anchor="start">no test fed the SRI the</text>
<text class="dg-note" x="468" y="398" text-anchor="start">trajectory it would fly</text>
<text class="dg-note" x="688" y="384" text-anchor="start">faithful, with rigor,</text>
<text class="dg-note" x="688" y="398" text-anchor="start">to Ariane 4&#x27;s world</text>
<text class="dg-note" x="24" y="444" text-anchor="start">Board, recommendation 2: as much real equipment as technically feasible, closed loop.  Recommendation 10: trajectory data in specs and tests.</text>

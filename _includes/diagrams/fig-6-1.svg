<div class="dg-figure" data-fig="fig-6-1" style="--dg-w:864px"><div class="dg-scroll"><svg class="dg" viewBox="0 0 864 560" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="fig-6-1-title fig-6-1-desc">
<title id="fig-6-1-title">The Programmer&#x27;s Workbench, 1973–78</title>
<desc id="fig-6-1-desc">Schematic, not a floor plan. Left: programmers, about 1,100 of them by the end of 1977, who before the workbench carried decks of punched cards and sent their jobs straight to each target machine. Centre: the Programmer&#x27;s Workbench, PWB/UNIX, a set of PDP-11s dedicated to development (seven PDP-11/45s and /70s by the end of 1977), with its small tools: the PWB shell by John Mashey, the Source Code Control System by Marc Rochkind, find, cpio and expr by Dick Haight, and the Remote Job Entry subsystem, which sent jobs to the targets and brought their output back. Right: the target machines, two IBM 370/168s, two UNIVAC 1100-series systems and an XDS Sigma 5. Bottom: a timeline. In 1972 Rochkind began SCCS on an IBM System/370; in mid-1973 Evan Ivie proposed doing development on a dedicated machine; late in 1973 the first PDP-11/45 was installed; PWB/UNIX 1.0 was released on 1 July 1977; by the end of 1977 the main installation ran seven PDP-11s for about 1,100 people; in 1978 Dolotta, Haight and Mashey described it in the Bell System Technical Journal.</desc>

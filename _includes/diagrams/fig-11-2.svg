<div class="dg-figure" data-fig="fig-11-2" style="--dg-w:864px"><div class="dg-scroll"><svg class="dg" viewBox="0 0 864 552" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="fig-11-2-title fig-11-2-desc">
<title id="fig-11-2-title">Where nine dependencies went</title>
<desc id="fig-11-2-desc">Verified Resale&#x27;s cross-team dependencies by the team that must deliver, at the first quarterly plan (month 4) and at month 9, drawn as one square per dependency: solid squares remained, dashed squares were cut, lettered by how the work moved (R taken over by Resale, P moved to the platform, F folded into a change already planned). Inventory: 3 to 2; Proof of a Gate purchase built by Resale from existing TicketIssued events instead of a new call. Venue Entry: 3 to 2; The revocation feed folded into Inventory&#x27;s reissue change as TicketRevoked, which Venue Entry&#x27;s list builder consumes. Orders &amp; Payments: 2 to 2; —. Bot Screening: 2 to 1; Per-buyer limits written by Resale in the rules engine, reviewed by Bot Screening. Billing &amp; Payouts: 3 to 3; —. Partner APIs: 3 to 1; Webhook delivery moved to the platform; listing endpoints written by Resale. Organizer Console: 1 to 1; —. Mobile App: 2 to 1; The Resale module in the fan app taken over by Resale; the release train and version floor remain. Fan Messaging: 2 to 1; The two messages written by Resale on Fan Messaging&#x27;s templates; pass replacement remains, as a contract. Design System: 1 to 0; Badge and capped-price field contributed by Resale through the contribution path. Security Engineering: 1 to 0; Partner credentials became self-service on the platform&#x27;s partner-facing path. Of Inventory&#x27;s two that remained, one is VR-01, the void and reissue in one step inside the barcode core, the dependency that blocked. Total: 23 at month 4, 14 at month 9; the nine cuts were six taken over by Resale, two moved to the platform and one folded into a change already planned.</desc>

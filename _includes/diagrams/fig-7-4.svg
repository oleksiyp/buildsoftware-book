<div class="dg-figure" data-fig="fig-7-4" style="--dg-w:864px"><div class="dg-scroll"><svg class="dg" viewBox="0 0 864 476" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="fig-7-4-title fig-7-4-desc">
<title id="fig-7-4-title">Encore&#x27;s tenant lifecycle</title>
<desc id="fig-7-4-desc">Five states owned by the tenant directory, left to right. Trial, entered by sign-up: no public sales yet; services allow setup and test sales only. Live, entered when onboarding&#x27;s verify step passes: normal sales and resale; services serve normally. Suspended, highlighted, entered only by a person&#x27;s decision with a reason (event TenantSuspended): valid tickets stay valid and there are no new sales; services stop new sales, pause resale listings and hold payouts. A suspended tenant can be reinstated to live (TenantReinstated). Offboarding, entered from live by notice of termination or a switch (TenantOffboardingStarted): future events are honored or re-homed; services run the export, stop new events and keep serving existing tickets. Closed, entered when the retrieval period ends and irreversible: no tickets remain; services erase per schedule and issue a deletion record. Each transition is an event, and each consumer&#x27;s handling of it is checked by a contract test. Separately, an event can be in the sub-state resale paused.</desc>

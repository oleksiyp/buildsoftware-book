<text class="dg-eyebrow" x="24" y="32" style="text-anchor:start">OWNED BY THE TENANT DIRECTORY · EVERY TRANSITION IS AN EVENT</text>
<text class="dg-eyebrow" x="24" y="236" style="text-anchor:start">ENTERED BY</text>
<text class="dg-note" x="28" y="252" text-anchor="start">Sign-up</text>
<text class="dg-note" x="196" y="252" text-anchor="start">Onboarding&#x27;s verify</text>
<text class="dg-note" x="196" y="265" text-anchor="start">step passes</text>
<text class="dg-note" x="364" y="252" text-anchor="start">A person&#x27;s decision,</text>
<text class="dg-note" x="364" y="265" text-anchor="start">with reason</text>
<text class="dg-note" x="532" y="252" text-anchor="start">Notice of termination</text>
<text class="dg-note" x="532" y="265" text-anchor="start">or switch</text>
<text class="dg-note" x="700" y="252" text-anchor="start">Retrieval period ends</text>
<text class="dg-eyebrow" x="24" y="296" style="text-anchor:start">WHAT IT MEANS FOR FANS</text>
<text class="dg-note" x="28" y="312" text-anchor="start">No public sales yet</text>
<text class="dg-note" x="196" y="312" text-anchor="start">Normal sales and resale</text>
<text class="dg-note" x="364" y="312" text-anchor="start">Valid tickets stay</text>
<text class="dg-note" x="364" y="325" text-anchor="start">valid; no new sales</text>
<text class="dg-note" x="532" y="312" text-anchor="start">Future events honored</text>
<text class="dg-note" x="532" y="325" text-anchor="start">or re-homed</text>
<text class="dg-note" x="700" y="312" text-anchor="start">None remain</text>
<text class="dg-eyebrow" x="24" y="356" style="text-anchor:start">WHAT EVERY SERVICE MUST DO</text>
<text class="dg-note" x="28" y="372" text-anchor="start">Allow setup and</text>
<text class="dg-note" x="28" y="385" text-anchor="start">test sales only</text>
<text class="dg-note" x="196" y="372" text-anchor="start">Serve normally</text>
<text class="dg-note" x="364" y="372" text-anchor="start">Stop new sales; pause</text>
<text class="dg-note" x="364" y="385" text-anchor="start">resale listings;</text>
<text class="dg-note" x="364" y="398" text-anchor="start">hold payouts</text>
<text class="dg-note" x="532" y="372" text-anchor="start">Run export; stop new</text>
<text class="dg-note" x="532" y="385" text-anchor="start">events; keep serving</text>
<text class="dg-note" x="532" y="398" text-anchor="start">existing tickets</text>
<text class="dg-note" x="700" y="372" text-anchor="start">Erase per schedule;</text>
<text class="dg-note" x="700" y="385" text-anchor="start">issue deletion record</text>
<text class="dg-note" x="24" y="432" text-anchor="start">Resale paused is a separate sub-state of one event: listings hidden, primary sales and valid tickets untouched.</text>

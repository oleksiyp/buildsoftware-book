<div class="dg-figure" data-fig="fig-11-4" style="--dg-w:864px"><div class="dg-scroll"><svg class="dg" viewBox="0 0 864 440" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="fig-11-4-title fig-11-4-desc">
<title id="fig-11-4-title">Two pivot years</title>
<desc id="fig-11-4-desc">Schematic in two parts. Top, Y2K windowing in the example Martyn Thomas gives: a year stored as two digits, 00 to 99, is read through a pivot at 20. Stored years 00 to 19 are read as 2000 to 2019, and 20 to 99 as 1920 to 1999, so the stored order and the century order no longer match. Cheaper than expanding to four digits and simpler to test, it was not a permanent solution: the pivot year is its built-in trigger. Bottom, Encore&#x27;s pivot year on a month scale from 0 to 30. The partner API accepts old-format references from the notice in month 2 until month 14, twelve months&#x27; notice. INV-DEBT-031 is entered in the debt register in month 6. From launch in month 12, old-format tickets (identity derived from order and seat) are still accepted, so every gate validator and the issuer carry two paths; the engineering review at month 24 finds the debt still open, as planned. The trigger is the day after the last event holding an old-format ticket, month 29, when both old paths and their replay tests are deleted in one change.</desc>

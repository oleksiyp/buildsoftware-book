<div class="dg-figure" data-fig="fig-8-5" style="--dg-w:864px"><div class="dg-scroll"><svg class="dg" viewBox="0 0 864 472" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="fig-8-5-title fig-8-5-desc">
<title id="fig-8-5-title">Contribution margin per resold ticket</title>
<desc id="fig-8-5-desc">Two waterfalls for one resold €60 ticket, through a partner and in Encore&#x27;s own app, using Encore&#x27;s averages at the month-18 review. Through a partner: the buyer&#x27;s 10% service fee is €6.00; the partner&#x27;s 4 points, €2.40, and the organizer&#x27;s 3 points, €1.80, are paid out, leaving Encore&#x27;s retained fee of €1.80; then PSP fees on the €66 payment, €0.85, variable platform cost, €0.12, average fraud losses, €0.15, and support, €0.30 (2% of resales disputed at €15 each), leave a contribution margin of €0.38. In Encore&#x27;s app there is no partner commission, so Encore retains €4.20 and, after the same costs, keeps a margin of €2.78, about seven times as much. Each additional point of dispute rate costs €0.15, so a dispute rate of about 4.5% would wipe out the partner-channel margin.</desc>

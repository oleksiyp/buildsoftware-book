<div class="dg-figure" data-fig="fig-1-2" style="--dg-w:864px"><div class="dg-scroll"><svg class="dg" viewBox="0 0 864 476" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="fig-1-2-title fig-1-2-desc">
<title id="fig-1-2-title">Encore at three sizes</title>
<desc id="fig-1-2-desc">Three stages from left to right, each with its people, code, path to production and the decision made by default. Year 1: 9 engineers in one team; one modular monolith in one repository; a pipeline one founder wrote and a few deploys a week; default: everyone reads everything, so nothing needs an owner. Year 4: 70 engineers in nine teams; seven services split from the monolith, whose repository was kept as the shared repository; a pipeline per service and about 20 deploys a day; default: code that did not move with a service stays where it is, owned by whoever last touched it. Year 7: 400 engineers in 40 teams and a platform group; services in the shared repository and in their own, web and mobile frontends on one design system; golden path, trunk-based development and canaries, about 180 deploys a working day; default: code that works is left alone. A bar under each stage shows headcount on one scale. The defaults, outlined in vermilion, were never written down at the time.</desc>

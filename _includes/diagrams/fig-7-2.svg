<div class="dg-figure" data-fig="fig-7-2" style="--dg-w:864px"><div class="dg-scroll"><svg class="dg" viewBox="0 0 864 420" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="fig-7-2-title fig-7-2-desc">
<title id="fig-7-2-title">Encore&#x27;s self-service onboarding funnel</title>
<desc id="fig-7-2-desc">Horizontal bars for Encore&#x27;s self-service venues over the four quarters before Verified Resale, with the share of sign-ups and the median time from sign-up for each step. Signed up: 180 venues, 100%. Storefront provisioned (onboarding_storefront_provisioned): 178, 99%, 4 minutes. Payout account verified (onboarding_payout_account_verified): 161, 89%, 1 day. Seat map completed (onboarding_seat_map_completed): 97, 54%, 6 days. First event published (onboarding_first_event_published): 92, 51%, 7 days. First sale to a fan (onboarding_first_sale_recorded): 85, 47%, 13 days. The highlighted gap at the seat map, 64 venues, is the largest single loss. The provisioning workflow takes minutes; the venue&#x27;s own work takes days.</desc>

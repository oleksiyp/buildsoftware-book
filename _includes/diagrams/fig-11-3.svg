<div class="dg-figure" data-fig="fig-11-3" style="--dg-w:864px"><div class="dg-scroll"><svg class="dg" viewBox="0 0 864 540" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="fig-11-3-title fig-11-3-desc">
<title id="fig-11-3-title">The identity, before and after the seam</title>
<desc id="fig-11-3-desc">Two panels. Before the change: every reader reaches the ticket identity derived from order and seat directly. The issuer computes it in each of its 19 public variants; four other places in Encore&#x27;s code recompute it; 60 call sites in 11 repositories owned by seven teams parse it out of the barcode; and copies outside Encore&#x27;s repositories read it too, among them a partner&#x27;s parser of the old event-code prefix and a vendor&#x27;s turnstile firmware that computes it from order and seat. After the seam: the issuer&#x27;s computation sits in the one pinch point every variant calls, the four other places and the migrated call sites ask one identity interface instead of computing or parsing, and partners receive an opaque ticket_id through the API while the turnstile vendor ships corrected firmware. Behind the interface sits the opaque identity with its lookup. Before it was trusted, a parallel run in month 8 computed the identity both ways on every issuance for three weeks, served the old result and logged two mismatches, both for tickets issued while an event was being rescheduled.</desc>
